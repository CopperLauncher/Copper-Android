name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk' 
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          sudo apt update && sudo apt install -y wget
          mkdir -p app_pojavlauncher/libs
          cd app_pojavlauncher/libs
          wget https://github.com/CopperLauncher/LTW/releases/latest/download/ltw-release.aar
      
      - name: Get JRE8
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "8.11"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Release .apk
        run: |
          gradle :app_pojavlauncher:assembleRelease
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-arm64-v8a-release.apk   out/app-arm64-v8a-release.apk
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-armeabi-v7a-release.apk out/app-armeabi-v7a-release.apk
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-x86-release.apk         out/app-x86-release.apk
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-x86_64-release.apk      out/app-x86_64-release.apk
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-universal-release.apk   out/app-universal-release.apk

      - name: Gen md5sums
        run: |
          for f in out/app-*-release.apk; do md5sum "$f" > "$f.md5"; done

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Build APK without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          rm -rf app_pojavlauncher/src/main/assets/components/jre-25
          ./gradlew assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug-noruntime.apk
      
      - name: Gen md5sums
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug (recommended)
          path: out/app-debug.*

      - name: Upload APK (without runtime)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-noruntime
          path: out/app-debug-noruntime.*
      - name: Upload arm64-v8a release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: out/app-arm64-v8a-release.*

      - name: Upload armeabi-v7a release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: out/app-armeabi-v7a-release.*

      - name: Upload x86 release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-x86-release
          path: out/app-x86-release.*

      - name: Upload x86_64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: out/app-x86_64-release.*

      - name: Upload universal release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-release
          path: out/app-universal-release.*
