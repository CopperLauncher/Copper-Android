plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    // Only types are needed; the game provides LWJGL at runtime.
    compileOnly 'org.lwjgl:lwjgl:3.3.6'
    compileOnly 'org.lwjgl:lwjgl-nfd:3.3.6'
}

// NFDPathSet is a compile-time stand-in for the struct that only exists in
// lwjgl-nfd 3.2.x-3.3.1. It must not ship: the game's own lwjgl-nfd.jar
// provides the real class at runtime.
jar {
    exclude 'org/lwjgl/util/nfd/NFDPathSet.class'
}
